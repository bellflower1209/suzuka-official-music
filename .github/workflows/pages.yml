name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify generated site and Node.js scripts
        run: |
          node --version
          node --check assets/analytics.js
          node --check assets/main.js
          node --check assets/explorer-update.js
          node --check scripts/browser_analytics_realtime_qa.mjs
          node --check scripts/browser_photobook_analytics_qa.mjs
          python3 scripts/audit_actions_node24.py
          python3 scripts/audit_analytics.py
          python3 scripts/audit_photobooks.py
          python3 scripts/audit_lyrics_sources.py
          python3 scripts/audit_rich_results.py
          python3 scripts/validate_sitemap.py
          python3 scripts/audit_sitemaps.py
          python3 scripts/audit_feed.py
          python3 scripts/audit_indexnow.py

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
